package com.example.qeyasat

import android.app.Activity
import android.app.AlertDialog
import android.content.Context
import android.content.Intent
import android.os.Bundle
import android.text.InputType
import android.view.Gravity
import android.view.View
import android.widget.ArrayAdapter
import android.widget.Button
import android.widget.EditText
import android.widget.LinearLayout
import android.widget.Spinner
import android.widget.TextView
import android.widget.Toast
import java.util.Locale
import kotlin.math.ceil

data class Material(
    var type: String,
    var measure: String,
    var count: String
)

class MainActivity : Activity() {

    private val materials = mutableListOf<Material>()
    private lateinit var list: LinearLayout
    private lateinit var prefs: android.content.SharedPreferences

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        prefs = getSharedPreferences("materials", Context.MODE_PRIVATE)
        load()

        home()
    }

    private fun baseLayout(): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(28, 28, 28, 28)
            layoutDirection = View.LAYOUT_DIRECTION_RTL
        }
    }

    private fun makeButton(text: String): Button {
        return Button(this).apply {
            this.text = text
            textSize = 17f
            isAllCaps = false
        }
    }

    private fun backButton(): Button {
        return makeButton("⬅️ رجوع للواجهة الرئيسية").apply {
            setOnClickListener {
                home()
            }
        }
    }

    private fun home() {

        val layout = baseLayout()

        val title = TextView(this).apply {
            text = "📏 قياسات - ادارة المواد"
            textSize = 26f
            gravity = Gravity.CENTER
            setPadding(0, 20, 0, 10)
        }

        val developer = TextView(this).apply {
            text = "المطور: محمد الفاتح"
            textSize = 16f
            gravity = Gravity.CENTER
            setPadding(0, 0, 0, 25)
        }

        val orderButton = makeButton("📦 الطلبية")
        val featherButton = makeButton("📏 حساب عدد الريش")
        val weightButton = makeButton("⚖️ حساب وزن الريش")

        layout.addView(title)
        layout.addView(developer)
        layout.addView(orderButton)
        layout.addView(featherButton)
        layout.addView(weightButton)

        orderButton.setOnClickListener {
            orderScreen()
        }

        featherButton.setOnClickListener {
            featherScreen()
        }

        weightButton.setOnClickListener {
            weightScreen()
        }

        setContentView(layout)
    }

    private fun orderScreen() {

        val layout = baseLayout()

        val title = TextView(this).apply {
            text = "📏 قياسات - ادارة المواد"
            textSize = 24f
            gravity = Gravity.CENTER
            setPadding(0, 10, 0, 10)
        }

        val addButton = makeButton("➕ إضافة صنف")
        val shareButton = makeButton("📤 مشاركة المعلومات")
        val clearButton = makeButton("🗑 مسح الكل")

        list = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
        }

        layout.addView(title)
        layout.addView(backButton())
        layout.addView(addButton)
        layout.addView(shareButton)
        layout.addView(clearButton)
        layout.addView(list)

        addButton.setOnClickListener {
            itemDialog(-1)
        }

        shareButton.setOnClickListener {
            shareOrder()
        }

        clearButton.setOnClickListener {

            if (materials.isEmpty()) {
                Toast.makeText(
                    this,
                    "لا توجد أصناف",
                    Toast.LENGTH_SHORT
                ).show()
                return@setOnClickListener
            }

            AlertDialog.Builder(this)
                .setTitle("مسح الطلبية")
                .setMessage("هل تريد مسح جميع الأصناف؟")
                .setPositiveButton("نعم") { _, _ ->

                    materials.clear()
                    save()
                    refresh()
                }
                .setNegativeButton("إلغاء", null)
                .show()
        }

        setContentView(layout)

        refresh()
    }

    private fun refresh() {

        list.removeAllViews()

        if (materials.isEmpty()) {

            val emptyText = TextView(this).apply {
                text = "لا توجد أصناف بعد\nاضغط «إضافة صنف» لإدخال البضاعة"
                textSize = 18f
                gravity = Gravity.CENTER
                setPadding(10, 40, 10, 40)
            }

            list.addView(emptyText)
            return
        }

        materials.forEachIndexed { index, material ->

            val row = TextView(this).apply {

                text =
                    "${index + 1}- ${material.type} | " +
                    "القياس: ${material.measure.ifBlank { "—" }} | " +
                    "العدد: ${material.count.ifBlank { "—" }}"

                textSize = 18f
                setPadding(10, 18, 10, 18)
            }

            row.setOnClickListener {
                itemDialog(index)
            }

            list.addView(row)
        }
    }

    private fun itemDialog(index: Int) {

        val box = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(30, 10, 30, 10)
        }

        val type = EditText(this).apply {
            hint = "نوع المنتج"
            inputType = InputType.TYPE_CLASS_TEXT
        }

        val measure = EditText(this).apply {
            hint = "القياس"
            inputType = InputType.TYPE_CLASS_TEXT
        }

        val count = EditText(this).apply {
            hint = "العدد (مثال: 6 قطعة أو 5 كراتين)"
            inputType = InputType.TYPE_CLASS_TEXT
        }

        if (index >= 0) {

            val oldItem = materials[index]

            type.setText(oldItem.type)
            measure.setText(oldItem.measure)
            count.setText(oldItem.count)
        }

        box.addView(TextView(this).apply {
            text = "اكتب بيانات البضاعة"
            textSize = 17f
        })

        box.addView(type)
        box.addView(measure)
        box.addView(count)

        val builder = AlertDialog.Builder(this)
            .setTitle(
                if (index < 0) {
                    "إضافة صنف"
                } else {
                    "تعديل الصنف"
                }
            )
            .setView(box)
            .setPositiveButton("حفظ", null)
            .setNegativeButton("إلغاء", null)

        if (index >= 0) {
            builder.setNeutralButton("حذف", null)
        }

        val dialog = builder.create()

        dialog.setOnShowListener {

            dialog.getButton(
                AlertDialog.BUTTON_POSITIVE
            ).setOnClickListener {

                val productName =
                    type.text.toString().trim()

                if (productName.isEmpty()) {

                    type.error = "اكتب اسم المنتج"
                    return@setOnClickListener
                }

                val newItem = Material(
                    productName,
                    measure.text.toString().trim(),
                    count.text.toString().trim()
                )

                if (index < 0) {
                    materials.add(newItem)
                } else {
                    materials[index] = newItem
                }

                save()
                refresh()

                dialog.dismiss()
            }

            if (index >= 0) {

                dialog.getButton(
                    AlertDialog.BUTTON_NEUTRAL
                ).setOnClickListener {

                    materials.removeAt(index)

                    save()
                    refresh()

                    dialog.dismiss()
                }
            }
        }

        dialog.show()
    }

